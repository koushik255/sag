<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws://127.0.0.1:5173; worker-src 'self' blob:; media-src 'none'; object-src 'none'; base-uri 'none'" />
    <title>StopAndGo</title>
  </head>
  <body>
    <header class="appbar">
      <nav aria-label="Library">
        <button class="nav-item active" data-library="movies">Movies</button>
        <button class="nav-item" data-library="clips">Clips</button>
        <button class="nav-item" data-library="screenshots">Screenshots</button>
      </nav>
      <div class="appbar-tools">
        <input id="search" type="search" placeholder="Search" autocomplete="off" aria-label="Search library" />
        <button id="refresh" title="Refresh library" aria-label="Refresh library">↻</button>
        <button id="open-settings">Connection</button>
      </div>
    </header>

    <main class="main">
      <header class="library-header">
        <h1 id="library-title">Movies</h1>
        <p id="library-note">Not connected</p>
      </header>
      <section id="notice" class="notice" hidden></section>
      <section id="library" class="library-grid" aria-live="polite"></section>
    </main>

    <section id="player-view" class="player-view" hidden>
      <div class="stage" id="stage">
        <canvas id="video"></canvas>
        <div class="player-topbar">
          <button id="close-player" class="icon-button" aria-label="Back to library">←</button>
          <div class="player-heading">
            <h2 id="player-title"></h2>
            <p id="player-details"></p>
          </div>
        </div>

        <div id="player-error" class="player-message" hidden></div>
        <div id="player-warning" class="player-message" hidden></div>
        <div class="loading" id="player-loading">Opening media…</div>
        <div id="export-toast" class="export-toast" hidden></div>

        <div class="controls" id="controls">
          <input id="timeline" class="timeline" type="range" min="0" max="1" value="0" step="0.001" aria-label="Seek" />
          <div class="control-row">
            <button id="play" class="control-button play-button" aria-label="Play">
              <span class="play-icon">▶</span><span class="pause-icon">Ⅱ</span>
            </button>
            <span id="current-time" class="time">0:00</span><span class="time-separator">/</span><span id="duration" class="time">0:00</span>
            <button id="mute" class="control-button" aria-label="Mute">vol</button>
            <input id="volume" class="volume" type="range" min="0" max="1" value="0.7" step="0.01" aria-label="Volume" />
            <div class="control-spacer"></div>
            <button id="make-clip" class="action-button" title="Save the last 15 seconds (5)">clip 15s</button>
            <button id="take-screenshot" class="action-button" title="Save screenshot (S)">screenshot</button>
            <button id="fullscreen" class="control-button" aria-label="Fullscreen" title="Fullscreen (F)">⛶</button>
          </div>
        </div>
      </div>
    </section>

    <section id="screenshot-view" class="screenshot-view" hidden>
      <div class="screenshot-toolbar">
        <button id="close-screenshot" class="icon-button" aria-label="Back to screenshots">←</button>
        <div class="player-heading"><h2 id="screenshot-title"></h2><p id="screenshot-details"></p></div>
      </div>
      <div id="screenshot-loading" class="loading">Loading screenshot…</div>
      <div id="screenshot-error" class="player-message" hidden></div>
      <img id="screenshot-image" alt="" />
    </section>

    <dialog id="settings-dialog">
      <form id="settings-form">
        <div class="dialog-title"><h2>Connection</h2><button type="button" id="close-settings" aria-label="Close">×</button></div>
        <label>Server URL<input id="server-url" type="url" placeholder="http://100.x.x.x:8765" required /></label>
        <label>Token<input id="server-token" type="password" autocomplete="off" placeholder="Leave blank to keep saved token" /></label>
        <p id="token-note" class="form-note"></p>
        <p id="settings-status" class="form-status"></p>
        <div class="dialog-actions">
          <button type="button" id="test-connection">Test</button>
          <button type="submit" class="primary">Save</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
