<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clips and screenshots</title>
  </head>
  <body>
    <h1 id="title">Clips</h1>

    <nav aria-label="Libraries">
      <button data-library="clips" aria-pressed="true">Clips</button>
      <button data-library="screenshots" aria-pressed="false">Screenshots</button>
    </nav>

    <p>
      <label for="search">Search</label>
      <input id="search" type="search">
      <button id="refresh">Refresh</button>
    </p>

    <main>
      <section id="login" hidden>
        <form id="login-form">
          <p><label for="token">Server token</label></p>
          <input id="token" type="password" autocomplete="current-password">
          <button type="submit">Connect</button>
        </form>
      </section>
      <p id="status">Loading…</p>
      <p id="count"></p>
      <section id="library" aria-live="polite"></section>
    </main>

    <script src="/static/app.js" defer></script>
  </body>
</html>
